server {
    listen 80;
    listen [::]:80;
    server_name astrosferum.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        return 301 https://astrosferum.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astrosferum.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/astrosferum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrosferum.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:astrosferum:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/astrosferum.com.access.log;
    error_log /var/log/nginx/astrosferum.com.error.log warn;
    client_max_body_size 32k;

    # The public shell is under active development. Keep every response out of
    # search indexes until the operator deliberately removes this policy.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /auth/telegram/login {
        limit_req zone=astrosferum_login burst=3 nodelay;
        include /etc/nginx/snippets/astrosferum-proxy.conf;
    }

    location = /api/v1/astrodome/jobs {
        limit_req zone=astrosferum_admission burst=3 nodelay;
        include /etc/nginx/snippets/astrosferum-proxy.conf;
    }

    location / {
        limit_req zone=astrosferum_general burst=60 nodelay;
        include /etc/nginx/snippets/astrosferum-proxy.conf;
    }
}

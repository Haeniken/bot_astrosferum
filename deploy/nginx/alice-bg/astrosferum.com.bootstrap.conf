# Enable this HTTP-only vhost before the first certificate exists. Do not
# enable astrosferum.com.conf at the same time: it references the future
# /etc/letsencrypt/live/astrosferum.com files and would make nginx -t fail.
server {
    listen 80;
    listen [::]:80;
    server_name astrosferum.com;
    server_tokens off;

    access_log /var/log/nginx/astrosferum.com.access.log;
    error_log /var/log/nginx/astrosferum.com.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}

proxy_pass https://65.21.234.109:18082;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name astrosferum-origin.internal;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /etc/nginx/certs/astrosferum-origin.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;
proxy_set_header Host astrosferum.com;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Host astrosferum.com;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 15m;
proxy_request_buffering off;
proxy_buffering off;

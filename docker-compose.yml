name: bot_astrosferum

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bot_astrosferum}
      POSTGRES_USER: ${POSTGRES_USER:-bot_astrosferum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB"]
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: "1.00"
    security_opt:
      - no-new-privileges:true
    networks:
      - astrosferum_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  bot_astrosferum:
    image: bot_astrosferum:latest
    pull_policy: never
    build:
      context: .
    command: ["serve", "--config", "/app/config/config.yaml"]
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 24GiB
      ASTRO_HORIZON_ANALYSIS_ENABLED: ${ASTRO_HORIZON_ANALYSIS_ENABLED:-true}
      ASTRO_ASTRODOME_ENABLED: ${ASTRO_ASTRODOME_ENABLED:-true}
      ASTRO_COPERNICUS_DEM_GLO30_ENABLED: ${ASTRO_COPERNICUS_DEM_GLO30_ENABLED:-true}
      ASTRO_COPERNICUS_DEM_CACHE_LIMIT: ${ASTRO_COPERNICUS_DEM_CACHE_LIMIT:-20GiB}
      ASTRO_ASTRODOME_RESIDENT_LIMIT: ${ASTRO_ASTRODOME_RESIDENT_LIMIT:-10GiB}
      ASTRO_ASTRODOME_JOB_TIMEOUT: ${ASTRO_ASTRODOME_JOB_TIMEOUT:-0s}
      ASTRO_DIRECTIONAL_INTERNAL_REQUEST_TIMEOUT: ${ASTRO_DIRECTIONAL_INTERNAL_REQUEST_TIMEOUT:-0s}
      ASTRO_DIRECTIONAL_QUEUE_SIZE: ${ASTRO_DIRECTIONAL_QUEUE_SIZE:-8}
      ASTRO_DIRECTIONAL_CONCURRENCY: ${ASTRO_DIRECTIONAL_CONCURRENCY:-1}
      ASTRO_GEOS_CF_ENABLED: ${ASTRO_GEOS_CF_ENABLED:-true}
      ASTRO_FORECAST_CONCURRENCY: ${ASTRO_FORECAST_CONCURRENCY:-2}
      ASTRO_HORIZON_CONCURRENCY: ${ASTRO_HORIZON_CONCURRENCY:-1}
      ASTRO_ICON_DOWNLOAD_LIMIT_MBIT: ${ASTRO_ICON_DOWNLOAD_LIMIT_MBIT:-}
      ASTRO_OVERALL_SEEING_WEIGHT: ${ASTRO_OVERALL_SEEING_WEIGHT:-1.0}
      ASTRO_OVERALL_CLOUD_WEIGHT: ${ASTRO_OVERALL_CLOUD_WEIGHT:-2.0}
      ASTRO_OVERALL_COHERENCE_TIME_WEIGHT: ${ASTRO_OVERALL_COHERENCE_TIME_WEIGHT:-0.25}
      ASTRO_OVERALL_OPTICAL_TURBULENCE_MAX_PENALTY: ${ASTRO_OVERALL_OPTICAL_TURBULENCE_MAX_PENALTY:-0.25}
      ASTRO_OVERALL_POSSIBLE_FOG_FACTOR: ${ASTRO_OVERALL_POSSIBLE_FOG_FACTOR:-0.75}
      ASTRO_OVERALL_HIGH_FOG_FACTOR: ${ASTRO_OVERALL_HIGH_FOG_FACTOR:-0.10}
      ASTRO_OVERALL_PRECIPITATION_DETECT_MM: ${ASTRO_OVERALL_PRECIPITATION_DETECT_MM:-0.05}
      ASTRO_OVERALL_GOOD_SEEING_ARCSEC: ${ASTRO_OVERALL_GOOD_SEEING_ARCSEC:-0.5}
      ASTRO_OVERALL_BAD_SEEING_ARCSEC: ${ASTRO_OVERALL_BAD_SEEING_ARCSEC:-2.0}
      ASTRO_OVERALL_BEST_COHERENCE_TIME_MS: ${ASTRO_OVERALL_BEST_COHERENCE_TIME_MS:-5.2}
      ASTRO_OVERALL_BAD_COHERENCE_TIME_MS: ${ASTRO_OVERALL_BAD_COHERENCE_TIME_MS:-1.6}
      ASTRO_OVERALL_GROUND_CN2_SCALE: ${ASTRO_OVERALL_GROUND_CN2_SCALE:-1.0}
      ASTRO_OVERALL_UNRESOLVED_CLOUD_OBSTRUCTION: ${ASTRO_OVERALL_UNRESOLVED_CLOUD_OBSTRUCTION:-0.45}
      ASTRO_OVERALL_SURFACE_WIND_MAX_PENALTY: ${ASTRO_OVERALL_SURFACE_WIND_MAX_PENALTY:-0.20}
      ASTRO_OVERALL_SURFACE_WIND_START_MS: ${ASTRO_OVERALL_SURFACE_WIND_START_MS:-8.5}
      ASTRO_OVERALL_SURFACE_WIND_FULL_MS: ${ASTRO_OVERALL_SURFACE_WIND_FULL_MS:-15.0}
      ASTRO_OVERALL_SURFACE_GUST_START_MS: ${ASTRO_OVERALL_SURFACE_GUST_START_MS:-12.0}
      ASTRO_OVERALL_SURFACE_GUST_FULL_MS: ${ASTRO_OVERALL_SURFACE_GUST_FULL_MS:-22.0}
      ASTRO_CLOUD_LIQUID_RADIUS_MICROMETERS: ${ASTRO_CLOUD_LIQUID_RADIUS_MICROMETERS:-10}
      ASTRO_CLOUD_ICE_RADIUS_MICROMETERS: ${ASTRO_CLOUD_ICE_RADIUS_MICROMETERS:-25}
      ASTRO_LIGHT_POLLUTION_ATLAS_YEAR: ${ASTRO_LIGHT_POLLUTION_ATLAS_YEAR:-2024}
      ASTRO_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ASTRO_TELEGRAM_ADMIN_IDS: ${ASTRO_TELEGRAM_ADMIN_IDS-}
      ASTRO_VK_ADMIN_IDS: ${ASTRO_VK_ADMIN_IDS-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
      - ./secrets/telegram_token:/run/secrets/telegram_token:ro
      - ./secrets/vk_token:/run/secrets/vk_token:ro
    secrets:
      - directional_credential
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - egress
      - astrosferum_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Horizon and Astrodome execute here with ASTRO_DIRECTIONAL_CONCURRENCY
  # active slots (default 1). Queue capacity is configured separately. The bot
  # remains the only ICON downloader/publisher. The worker sees immutable model
  # runs read-only; a cold admitted directional job may populate only the shared
  # bounded GLO-30 terrain cache before continuing the calculation.
  directional_worker:
    image: bot_astrosferum:latest
    pull_policy: never
    entrypoint: ["/usr/local/bin/bot_astrosferum_directional_worker"]
    command: ["--config", "/app/config/config.yaml"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      GOMEMLIMIT: ${ASTRO_DIRECTIONAL_WORKER_GOMEMLIMIT:-12GiB}
      ASTRO_HORIZON_ANALYSIS_ENABLED: ${ASTRO_HORIZON_ANALYSIS_ENABLED:-true}
      ASTRO_ASTRODOME_ENABLED: ${ASTRO_ASTRODOME_ENABLED:-true}
      ASTRO_COPERNICUS_DEM_GLO30_ENABLED: ${ASTRO_COPERNICUS_DEM_GLO30_ENABLED:-true}
      ASTRO_COPERNICUS_DEM_CACHE_LIMIT: ${ASTRO_COPERNICUS_DEM_CACHE_LIMIT:-20GiB}
      ASTRO_ASTRODOME_RESIDENT_LIMIT: ${ASTRO_ASTRODOME_RESIDENT_LIMIT:-10GiB}
      ASTRO_ASTRODOME_JOB_TIMEOUT: ${ASTRO_ASTRODOME_JOB_TIMEOUT:-0s}
      ASTRO_DIRECTIONAL_INTERNAL_REQUEST_TIMEOUT: ${ASTRO_DIRECTIONAL_INTERNAL_REQUEST_TIMEOUT:-0s}
      ASTRO_DIRECTIONAL_QUEUE_SIZE: ${ASTRO_DIRECTIONAL_QUEUE_SIZE:-8}
      ASTRO_DIRECTIONAL_CONCURRENCY: ${ASTRO_DIRECTIONAL_CONCURRENCY:-1}
      ASTRO_OVERALL_SEEING_WEIGHT: ${ASTRO_OVERALL_SEEING_WEIGHT:-1.0}
      ASTRO_OVERALL_CLOUD_WEIGHT: ${ASTRO_OVERALL_CLOUD_WEIGHT:-2.0}
      ASTRO_OVERALL_COHERENCE_TIME_WEIGHT: ${ASTRO_OVERALL_COHERENCE_TIME_WEIGHT:-0.25}
      ASTRO_OVERALL_OPTICAL_TURBULENCE_MAX_PENALTY: ${ASTRO_OVERALL_OPTICAL_TURBULENCE_MAX_PENALTY:-0.25}
      ASTRO_OVERALL_POSSIBLE_FOG_FACTOR: ${ASTRO_OVERALL_POSSIBLE_FOG_FACTOR:-0.75}
      ASTRO_OVERALL_HIGH_FOG_FACTOR: ${ASTRO_OVERALL_HIGH_FOG_FACTOR:-0.10}
      ASTRO_OVERALL_PRECIPITATION_DETECT_MM: ${ASTRO_OVERALL_PRECIPITATION_DETECT_MM:-0.05}
      ASTRO_OVERALL_GOOD_SEEING_ARCSEC: ${ASTRO_OVERALL_GOOD_SEEING_ARCSEC:-0.5}
      ASTRO_OVERALL_BAD_SEEING_ARCSEC: ${ASTRO_OVERALL_BAD_SEEING_ARCSEC:-2.0}
      ASTRO_OVERALL_BEST_COHERENCE_TIME_MS: ${ASTRO_OVERALL_BEST_COHERENCE_TIME_MS:-5.2}
      ASTRO_OVERALL_BAD_COHERENCE_TIME_MS: ${ASTRO_OVERALL_BAD_COHERENCE_TIME_MS:-1.6}
      ASTRO_OVERALL_GROUND_CN2_SCALE: ${ASTRO_OVERALL_GROUND_CN2_SCALE:-1.0}
      ASTRO_OVERALL_UNRESOLVED_CLOUD_OBSTRUCTION: ${ASTRO_OVERALL_UNRESOLVED_CLOUD_OBSTRUCTION:-0.45}
      ASTRO_OVERALL_SURFACE_WIND_MAX_PENALTY: ${ASTRO_OVERALL_SURFACE_WIND_MAX_PENALTY:-0.20}
      ASTRO_OVERALL_SURFACE_WIND_START_MS: ${ASTRO_OVERALL_SURFACE_WIND_START_MS:-8.5}
      ASTRO_OVERALL_SURFACE_WIND_FULL_MS: ${ASTRO_OVERALL_SURFACE_WIND_FULL_MS:-15.0}
      ASTRO_OVERALL_SURFACE_GUST_START_MS: ${ASTRO_OVERALL_SURFACE_GUST_START_MS:-12.0}
      ASTRO_OVERALL_SURFACE_GUST_FULL_MS: ${ASTRO_OVERALL_SURFACE_GUST_FULL_MS:-22.0}
      ASTRO_CLOUD_LIQUID_RADIUS_MICROMETERS: ${ASTRO_CLOUD_LIQUID_RADIUS_MICROMETERS:-10}
      ASTRO_CLOUD_ICE_RADIUS_MICROMETERS: ${ASTRO_CLOUD_ICE_RADIUS_MICROMETERS:-25}
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./data/models:/app/data/models:ro
      - ./data/terrain:/app/data/terrain
      - ./data/cache/directional:/app/data/cache/directional
      - ./data/state/run-leases:/app/data/state/run-leases
      - ./data/tmp/directional-worker:/app/data/tmp
    secrets:
      - directional_credential
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${ASTRO_DIRECTIONAL_WORKER_MEMORY_LIMIT:-32g}
    cpus: "${ASTRO_DIRECTIONAL_WORKER_CPU_LIMIT:-10.00}"
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "/usr/local/bin/bot_astrosferum_directional_worker", "--healthcheck", "http://127.0.0.1:18084/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - egress
      - astrosferum_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  # Egress is available to the bot's forecast downloaders and to the isolated
  # directional worker for an admitted cold GLO-30 terrain-cache fill.
  egress:
  astrosferum_internal:
    external: true
    name: astrosferum-internal

secrets:
  # One credential authenticates web -> bot and bot -> worker. Its value is a
  # mode-0600 runtime file and never belongs in .env or Git.
  directional_credential:
    file: ./secrets/directional_credential

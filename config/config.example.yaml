app:
  locale: ru
  horizon: 72h
  step: 3h
  workers: 6
  forecast_concurrency: 2
  eccodes_workers: 8
  point_cache_entries: 512
  point_cache_memory_limit: 20GiB
  # Ordinary Telegram/VK request deadline only. Directional work is async and
  # governed by its kind-specific deadline plus internal_request_timeout.
  request_timeout: 15m

# ICON-EU-only low-altitude directional analysis. The legacy local queue
# values remain constructor bounds; production execution uses the single
# shared directional FIFO below and starts no second calculation worker.
horizon_analysis:
  enabled: true
  queue_size: 4
  concurrency: 1
  # Shared by Horizon extraction and Astrodome native-column preload inside
  # the isolated directional worker. Match the default eight-CPU worker quota.
  cdo_workers: 8
  job_timeout: 10m
  cache_ttl: 48h
  cache_entries: 128
  estimated_duration: 3m

# Horizon and Astrodome share this one bounded FIFO and active-slot limit.
# Keep concurrency at 1 until production memory/CPU benchmarks justify more;
# the hard validation range is 1..32.
directional:
  queue_size: 8
  concurrency: 1
  listen: :18083
  worker_url: http://directional_worker:18084
  worker_listen: :18084
  credential_file: /run/secrets/directional_credential
  completed_ttl: 48h
  completed_entries: 128
  estimated_horizon: 3m
  # UI/queue estimate only. It never cancels a calculation and remains
  # independent from the execution and transport timeout policy below.
  estimated_astrodome: 30m
  # 0s disables the bot -> worker HTTP deadline so a live calculation is not
  # truncated by transport. A positive value is an optional operator guard.
  internal_request_timeout: 0s

# ICON-EU-only full-sky calculation. enabled is the public rollout switch:
# true allows every authenticated Telegram identity, false allows only IDs in
# ASTRO_TELEGRAM_ADMIN_IDS; model preparation and the shared worker remain on
# for admin preview. The production product contains up to 72 consecutive native hourly frames.
# Dense source storage maps to the bounded production-v2 angular grid; sparse
# source storage is selected only when the project budget requires it.
astrodome:
  enabled: true
  # 0s disables the wall-clock job deadline. Explicit user cancellation and
  # process shutdown still cancel the calculation through its context.
  job_timeout: 0s
  cache_ttl: 48h
  cache_entries: 64
  # Maximum resident footprint of preloaded native ICON-EU columns per job.
  resident_limit: 10GiB
  project_disk_cap: 400GiB
  min_free_space: 100GiB
  min_free_inodes: 10000

paths:
  data: /app/data
  temp: /app/data/tmp

providers:
  icon_eu:
    enabled: true
    role: primary
    keep_runs: 2
    max_stale_age: 12h
  icon_global:
    enabled: true
    role: fallback
    keep_runs: 2
    max_stale_age: 18h
  icon_ru:
    enabled: true
    role: shadow
    keep_runs: 1
    max_stale_age: 18h
  # Independent global atmospheric-composition forecast used only by the
  # explicitly labelled Reference V-band diagnostic. Failure is fail-open:
  # the ICON forecast and legacy Overall remain available and V-ref is partial.
  geos_cf:
    enabled: true
    dataset_url: https://opendap.nccs.nasa.gov/dods/gmao/geos-cf/v2/fcst/xgc_tavg_1hr_glo_L1440x721_slv.latest
    # Cold OPeNDAP point subsets can take more than 30 seconds. This provider
    # deadline does not become an equal delay for the user-facing forecast:
    # the optional result is joined for a separately bounded short interval.
    request_timeout: 60s
    metadata_cache_ttl: 10m
    data_cache_ttl: 6h
    max_stale_age: 48h
    cache_entries: 256
  light_pollution:
    atlas_year: 2024

sync:
  poll_interval: 15m
  download_parallelism: 4
  download_limit_mbit: 0
  min_free_space: 150GiB

algorithms:
  seeing_version: seeing-hybrid-tke-mh-hmnsp99-v7
  dew_version: dew-v1
  conditions_version: conditions-v8-precip-veto-penalty-decomposition
  overall_seeing_weight: 1.0
  overall_cloud_weight: 2.0
  overall_coherence_time_weight: 0.25
  # Bounds only the combined seeing/tau0 contribution to the general-purpose
  # utility index. Physical epsilon and tau0 diagnostics are never clipped.
  overall_optical_turbulence_max_penalty: 0.25
  overall_possible_fog_factor: 0.75
  overall_high_fog_factor: 0.10
  # Operational binary veto: this is a detection threshold, not a smooth
  # rain-intensity penalty. At and above it an exposed telescope should stay closed.
  overall_precipitation_detect_mm: 0.05
  # Kept under its historical name for compatibility; this is now the
  # best-seeing saturation threshold rather than a generic "good" threshold.
  overall_good_seeing_arcsec: 0.5
  overall_bad_seeing_arcsec: 2.0
  overall_best_coherence_time_ms: 5.2
  overall_bad_coherence_time_ms: 1.6
  # ICON hourly MH is clamped to this AGL range before the TKE integral.
  overall_boundary_layer_min_m: 500
  overall_boundary_layer_top_m: 2000
  overall_ground_cn2_scale: 1.0
  # Low-cloud CLC uncertainty guard; middle/high use 55%/18% of it.
  overall_unresolved_cloud_obstruction: 0.45
  overall_surface_wind_max_penalty: 0.20
  overall_surface_wind_start_ms: 8.5
  overall_surface_wind_full_ms: 15.0
  overall_surface_gust_start_ms: 12.0
  overall_surface_gust_full_ms: 22.0
  cloud_liquid_radius_micrometers: 10
  cloud_ice_radius_micrometers: 25

render:
  version: render-v18-celestial-distance
  width: 1280
  height: 960

database:
  host: postgres
  port: 5432
  name: bot_astrosferum
  user: bot_astrosferum
  max_conns: 10

platforms:
  telegram:
    enabled: true
    token_file: /run/secrets/telegram_token
    admin_ids: [] # overridden by ASTRO_TELEGRAM_ADMIN_IDS
  vk:
    enabled: false
    token_file: /run/secrets/vk_token
    group_id: 0
    admin_ids: [] # overridden by ASTRO_VK_ADMIN_IDS

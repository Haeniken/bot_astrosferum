name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/bot_astrosferum ./cmd/bot_astrosferum
      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.6"
          go-package: ./...
          repo-checkout: false

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --pull -t bot_astrosferum:${{ github.sha }} .
      - name: Block Critical and High vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress \
            bot_astrosferum:${{ github.sha }}
